[build]
public_url = "/assets/"
# Subresource integrity, temporarily disabled. Revert this commit to restore it.
no_sri = true

# Trunk emits hashed CSS/JS/WASM at the dist root (only the URL prefix is
# rewritten, via public_url). This hook relocates those files into an `assets/`
# subdir to match, and replaces Trunk's inline module loader with an external
# self-initializing script so index.html carries no inline <script> (letting
# the CSP drop 'unsafe-inline'). See scripts/postbuild.py.
[[hooks]]
stage = "post_build"
command = "python3"
command_arguments = ["scripts/postbuild.py"]
