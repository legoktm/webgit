<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src blob:; connect-src 'self'; base-uri 'none'; form-action 'none'"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>webgit</title>
        <link data-trunk rel="css" href="styles.css" />

             hashes it like any stylesheet; the post-build hook then rewrites
             its <link> into a <meta> so the page doesn't apply it, leaving the
             hashed URL discoverable at startup. See scripts/postbuild.py. -->
        <link data-trunk rel="css" href="markdown.css" />
    </head>
    <body>
        <!-- The application shell (header, nav, path-bar, content) is rendered
             by the Yew `App` root, which mounts into <body>. -->
    </body>
