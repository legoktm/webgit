<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>webgit</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #0d1117;
        color: #e6edf3;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
      }

      h1 {
        margin: 0;
        font-size: 2rem;
        letter-spacing: 0.05em;
        color: #58a6ff;
      }

      #repo-form {
        display: flex;
        gap: 0.5rem;
        width: 100%;
        max-width: 640px;
      }

      #repo-url {
        flex: 1;
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 6px;
        color: #e6edf3;
        font-size: 0.95rem;
        padding: 0.5rem 0.75rem;
        outline: none;
      }

      #repo-url:focus {
        border-color: #58a6ff;
        box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
      }

      button[type="submit"] {
        background: #238636;
        border: 1px solid #2ea043;
        border-radius: 6px;
        color: #fff;
        cursor: pointer;
        font-size: 0.95rem;
        padding: 0.5rem 1rem;
        white-space: nowrap;
      }

      button[type="submit"]:hover { background: #2ea043; }

      #output {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 8px;
        padding: 1.25rem 1.75rem;
        width: 100%;
        max-width: 640px;
        font-size: 0.95rem;
        line-height: 1.6;
        min-height: 3rem;
      }

      #output:empty { display: none; }

      #output p { margin: 0.25rem 0; }
      #output code { background: #21262d; padding: 0.1em 0.4em; border-radius: 4px; font-size: 0.9em; }
      #output strong { color: #79c0ff; }
      #output .error { color: #f85149; }

      .spinner {
        width: 18px;
        height: 18px;
        border: 2px solid #30363d;
        border-top-color: #58a6ff;
        border-radius: 50%;
        display: inline-block;
        animation: spin 0.8s linear infinite;
        vertical-align: middle;
        margin-right: 0.4em;
      }

      ul.file-list {
        margin: 0.75rem 0 0;
        padding-left: 1.25rem;
        list-style: disc;
        max-height: 60vh;
        overflow-y: auto;
      }

      ul.file-list li { margin: 0.1rem 0; }

      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <h1>webgit</h1>
    <form id="repo-form">
      <input
        id="repo-url"
        type="url"
        placeholder="https://example.com/repo.git"
        value="http://127.0.0.1:8000/test-repo/gogs-mirror.git"
        spellcheck="false"
        autocomplete="off"
      />
      <button type="submit">Open</button>
    </form>
    <div id="output"></div>
  </body>
</html>
