<h3 class="summary-heading">repository</h3>
<table class="tag-table"><tbody>
    <tr><td class="label">clone URL</td><td class="mono">{{ clone_url }}</td></tr>
    <tr><td class="label">HEAD branch</td><td>{{ head_branch }}</td></tr>
    <tr><td class="label">branches</td><td>{{ branch_count }}</td></tr>
    <tr><td class="label">tags</td><td>{{ tag_count }}</td></tr>
</tbody></table>

<h3 class="summary-heading">webgit</h3>
<table class="tag-table"><tbody>
    <tr><td class="label">version</td><td>{{ version }}</td></tr>
    <tr><td class="label">cached objects</td><td>{{ object_count }}{% if idb_available %} ({{ size_mb }} MB){% else %} (IndexedDB unavailable){% endif %}</td></tr>
    <tr><td class="label">cached tag refs</td><td>{{ cached_tag_refs }}</td></tr>
</tbody></table>
