<div class="blob-info">
  blob: {{ blob_id }} (<a href="#" class="blob-plain-link">plain</a>)
</div>
<table class="blob-table">
  <tbody>
    {% for line in lines %}
    <tr id="n{{ loop.index }}">
      <td class="lno"><a href="#n{{ loop.index }}">{{ loop.index }}</a></td>
      <td class="code">{{ line }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
