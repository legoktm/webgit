<table class="tag-table">
    <tbody>
        <tr>
            <td class="label">tag name</td>
            <td>{{ name }}</td>
        </tr>
        <tr>
            <td class="label">tag date</td>
            <td>{{ date }}</td>
        </tr>
        {% if tagger_name %}
        <tr>
            <td class="label">tagged by</td>
            <td>{{ tagger_name }}</td>
        </tr>
        {% endif %}
        <tr>
            <td class="label">tagged object</td>
            <td class="mono">{{ commit }}</td>
        </tr>
    </tbody>
</table>

{% if contents %}
<pre class="tag-message">{{ contents }}</pre>
{% endif %}
