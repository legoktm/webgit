[package]
name = "git-async"
version = "0.1.1"
edition = "2024"
description = "An async-first library for reading git repositories"
readme = "README.md"
repository = "https://github.com/cyberia-ng/git-async"
license = "MIT OR Apache-2.0"
keywords = ["async", "git"]
categories = ["development-tools", "no-std"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
accessory.workspace = true
gib-fs.workspace = true
gib-hash.workspace = true
gib-parse.workspace = true
hex.workspace = true
jiff.workspace = true
miniz_oxide.workspace = true
nom.workspace = true

[dev-dependencies]
futures = { workspace = true, features = ["async-await", "executor"] }
gib-testkit.workspace = true
hex-literal.workspace = true
rand_core.workspace = true
rand_pcg.workspace = true
tempfile.workspace = true

[features]
default = []
diff = []
