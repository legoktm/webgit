[package]
name = "git-async"
version = "0.1.1"
edition = "2024"
description = "An async-first library for reading git repositories"
readme = "README.md"
repository = "https://github.com/cyberia-ng/git-async"
license = "MIT OR Apache-2.0"
keywords = ["async", "git"]
categories = ["development-tools", "no-std"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
accessory = "2.1.0"
hex = { version = "0.4.3", default-features = false, features = [] }
jiff = { version = "0.2.35", default-features = false }
miniz_oxide = "0.9.1"
nom = { version = "8.0.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
futures = "0.3.32"
hex-literal = "1.1.0"
rand_core = "0.10.0"
rand_pcg = "0.10.1"
tempfile = "3.27.0"

[features]
default = []
diff = []
