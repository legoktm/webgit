[package]
name = "webgit"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
git-async = "0.1.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlDocument",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "NodeList",
    "DomParser",
    "SupportedType",
    "Event",
    "EventTarget",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
    "console",
] }
console_error_panic_hook = "0.1"
