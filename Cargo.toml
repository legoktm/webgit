[workspace]
members = ["crates/*"]
# Make bare `cargo test`/`build` in the root cover the library crates too.
#
# gib-testkit and browser-tests are deliberately absent: `trunk build` builds the
# default members for wasm32, and both shell out to subprocesses and use
# unix-only APIs, so neither can be built for that target. gib-testkit is still
# covered by `cargo test --workspace`, and every crate that needs it takes it as
# a dev-dependency. browser-tests is reached by `cargo test --workspace` too, but
# its only target is gated behind a `browser` feature that is off by default —
# see crates/browser-tests/Cargo.toml.
default-members = [
    ".",
    "crates/gib",
    "crates/gib-archive",
    "crates/gib-attributes",
    "crates/gib-commitgraph",
    "crates/gib-diff",
    "crates/gib-fs",
    "crates/gib-hash",
    "crates/gib-log",
    "crates/gib-mailmap",
    "crates/gib-object",
    "crates/gib-odb",
    "crates/gib-pack",
    "crates/gib-parse",
    "crates/gib-patch",
    "crates/gib-ref",
    "crates/gib-xdiff",
]

[workspace.dependencies]
anyhow = "1"
cc = "1.2"
comrak = { version = "0.54.0", default-features = false }
console_error_panic_hook = "0.1"
fantoccini = "0.22.1"
futures = { version = "0.3.32", default-features = false }
gib = { path = "crates/gib" }
gib-archive = { path = "crates/gib-archive" }
gib-attributes = { path = "crates/gib-attributes" }
gib-commitgraph = { path = "crates/gib-commitgraph" }
gib-diff = { path = "crates/gib-diff" }
gib-fs = { path = "crates/gib-fs" }
gib-hash = { path = "crates/gib-hash" }
gib-log = { path = "crates/gib-log" }
gib-mailmap = { path = "crates/gib-mailmap" }
gib-object = { path = "crates/gib-object" }
gib-odb = { path = "crates/gib-odb" }
gib-pack = { path = "crates/gib-pack" }
gib-parse = { path = "crates/gib-parse" }
gib-patch = { path = "crates/gib-patch" }
gib-ref = { path = "crates/gib-ref" }
gib-xdiff = { path = "crates/gib-xdiff" }
gib-testkit = { path = "crates/gib-testkit" }
git-version = "0.3.9"
hex = { version = "0.4.3", default-features = false, features = [] }
hex-literal = "1.1.0"
insta = "1"
jiff = { version = "0.2.35", default-features = false, features = ["alloc"] }
js-sys = "0.3"
miniz_oxide = "0.9.1"
nom = { version = "8.0.0", default-features = false, features = ["alloc"] }
rand_core = "0.10.0"
rand_pcg = "0.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.10.7", default-features = false }
similar = { version = "3.1.1", features = ["bytes"] }
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
tokio = "1.53.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Document",
    "Element",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    "HtmlIFrameElement",
    "NodeList",
    "DomParser",
    "SupportedType",
    "Event",
    "EventTarget",
    "ReadableStream",
    "ResponseInit",
    "ReadableStreamDefaultReader",
    "WritableStream",
    "WritableStreamDefaultWriter",
    "Request",
    "RequestCache",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
    "console",
    "IdbCursor",
    "IdbCursorWithValue",
    "IdbDatabase",
    "IdbFactory",
    "IdbKeyRange",
    "IdbObjectStore",
    "IdbObjectStoreParameters",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
] }
yew = "0.23"

[package]
name = "webgit"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow.workspace = true
futures = { workspace = true, features = ["alloc", "async-await"] }
gib.workspace = true
gib-archive.workspace = true
gib-log.workspace = true
gib-mailmap.workspace = true
gib-patch.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys.workspace = true
console_error_panic_hook.workspace = true
serde.workspace = true
serde_json.workspace = true
yew = { workspace = true, features = ["csr"] }
git-version.workspace = true
comrak.workspace = true
jiff.workspace = true

[dev-dependencies]
insta.workspace = true
futures = { workspace = true, features = ["async-await", "executor"] }
yew = { workspace = true, features = ["ssr"] }

# optimize for download bundle size
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true

# except these are on the hot path, optimize for performance.
[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release.package.sha1]
opt-level = 3
