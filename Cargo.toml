[workspace]
members = ["git-async"]
# Make bare `cargo test`/`build` in the root cover git-async too.
default-members = [".", "git-async"]

[package]
name = "webgit"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
futures = { version = "0.3", default-features = false, features = ["alloc", "async-await"] }
git-async = { path = "./git-async", features = ["diff"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Document",
    "Element",
    "NodeList",
    "DomParser",
    "SupportedType",
    "Event",
    "EventTarget",
    "Request",
    "RequestCache",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
    "console",
    "IdbCursor",
    "IdbCursorWithValue",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbObjectStoreParameters",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
] }
chrono = "0.4"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = { version = "3.1.1", features = ["bytes"] }
yew = { version = "0.23", features = ["csr"] }

[dev-dependencies]
insta = "1"
futures = { version = "0.3", features = ["executor"] }
yew = { version = "0.23", features = ["ssr"] }
